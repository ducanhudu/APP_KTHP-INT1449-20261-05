name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      # Nhóm đang dùng cả hai cách đặt tên; hai nhánh feat/* trước đây đã bị bỏ
      # sót CI vì chỉ khớp feature/**.
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "test/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze + Test (Flutter 3.47.6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --reporter expanded

  data-audit:
    name: Audit question bank
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check 300 questions
        run: python tool/audit_question_bank.py assets/flutter_quiz_300.json
