name: flutter_quiz_app
description: Ung dung Android on thi Flutter va Dart bang 300 cau hoi song ngu.
publish_to: none
version: 1.0.0+1

environment:
  # Dart 3.13.5 là bản đi kèm Flutter 3.47.6 (stable). Toàn bộ mã và test đã
  # chạy đạt trên phiên bản này, nên hạ mốc xuống 3.13.5 để máy khác cài được
  # mà không phải nâng Flutter.
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  # Ngày 3 – AI explain + TTS
  http: ^1.2.0
  flutter_tts: ^4.2.0
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^1.0.3
  google_mlkit_barcode_scanning: ^1.0.3
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/flutter_quiz_300.json
