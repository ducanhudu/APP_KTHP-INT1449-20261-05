org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental caches cannot resolve plugin paths across Windows drives.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Maven Central/Plugin Portal đôi khi trả 429 cho IP dùng chung (CI). Tăng số lần
# thử lại và giãn backoff thay vì để Gradle bỏ cuộc ngay.
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
